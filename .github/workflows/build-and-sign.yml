name: Build and Sign Deployment Tool

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild Paths
      uses: microsoft/setup-msbuild@v2

    - name: Compile Standalone C# File via MSBuild
      run: |
        # Generate a temporary project file on the fly to handle Windows Forms dependencies natively
        Set-Content -Path "TempProject.csproj" -Value @"
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>WinExe</OutputType>
            <TargetFramework>net48</TargetFramework>
            <UseWindowsForms>true</UseWindowsForms>
            <AssemblyName>DeploymentTool</AssemblyName>
            <OutputPath>bin\Release\</OutputPath>
          </PropertyGroup>
          <ItemGroup>
            <Compile Include="code" />
          </ItemGroup>
          <ItemGroup>
            <Reference Include="System" />
            <Reference Include="System.Drawing" />
            <Reference Include="System.Windows.Forms" />
          </ItemGroup>
        </Project>
        "@
        
        # Compile using MSBuild instead of calling the raw compiler binary directly
        msbuild TempProject.csproj /p:Configuration=Release

    - name: Secure Cloud Signing via SignPath
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        project-slug: 'DeploymentTool'
        signing-policy-slug: 'ReleaseSigning'
        artifact-configuration-slug: 'Artifacts'
        input-artifact-path: 'bin/Release/'
        output-artifact-path: 'bin/Signed/'

    - name: Upload Signed Binaries
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Deployment-Tool
        path: bin/Signed/
