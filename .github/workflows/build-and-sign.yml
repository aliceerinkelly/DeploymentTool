name: Build and Sign Deployment Tool

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger the build from GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild Path
      uses: microsoft/setup-msbuild@v2

    - name: Compile Standalone C# File
      run: |
        # This locates the correct C# compiler and attaches the Windows Forms assemblies your tool requires
        & 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\Roslyn\csc.exe' /target:winexe /out:bin\Release\DeploymentTool.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.dll code

    - name: Secure Cloud Signing via SignPath
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        project-slug: 'DeploymentTool'
        signing-policy-slug: 'ReleaseSigning'
        artifact-configuration-slug: 'Artifacts'
        input-artifact-path: 'bin/Release/'
        output-artifact-path: 'bin/Signed/'

    - name: Upload Signed Binaries
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Deployment-Tool
        path: bin/Signed/
