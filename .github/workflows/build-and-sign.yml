name: Build and Sign Deployment Tool

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild and Compiler Paths
      uses: microsoft/setup-msbuild@v2

    - name: Compile Standalone C# File
      run: |
        csc.exe /target:winexe /out:bin\Release\DeploymentTool.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.dll "${{ github.workspace }}\code"

    - name: Secure Cloud Signing via SignPath
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        project-slug: 'DeploymentTool'
        signing-policy-slug: 'ReleaseSigning'
        artifact-configuration-slug: 'Artifacts'
        input-artifact-path: 'bin/Release/'
        output-artifact-path: 'bin/Signed/'

    - name: Upload Signed Binaries
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Deployment-Tool
        path: bin/Signed/
